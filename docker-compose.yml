# Mailpit catches every outbound message so the email path can be exercised
# end to end without anything reaching a real public mailbox.
#   docker compose up -d   then open http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: segnalazioni-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    restart: unless-stopped
